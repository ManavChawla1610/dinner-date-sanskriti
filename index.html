<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Quest</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      background: #5c94fc;
    }

    /* Start Overlay */
    #start-screen {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      z-index: 1000;
    }
    .retro-btn {
      padding: 16px 28px;
      font-family: 'Press Start 2P', monospace;
      font-size: 14px;
      color: #fff;
      background: #e72521;
      border: 4px solid #fff;
      box-shadow: 4px 4px 0 #000;
      cursor: pointer;
    }

    /* Stage Background */
    #world {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(to bottom, #70a2ff 0%, #a2c4ff 70%, #68a0ff 100%);
    }
    .ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 50px;
      background: #c84c0c;
      border-top: 6px solid #00a800;
    }

    /* Mobile-Scaled Pigeon */
    #pigeon {
      position: absolute;
      top: 8%;
      left: -120px;
      width: 90px;
      height: 90px;
      display: none;
      z-index: 100;
      pointer-events: none;
      filter: drop-shadow(3px 3px 0px rgba(0,0,0,0.25));
    }
    @keyframes flyAround {
      0% { left: -120px; top: 8%; transform: scaleX(1); }
      30% { left: 65vw; top: 6%; transform: scaleX(1); }
      35% { left: 65vw; top: 6%; transform: scaleX(-1); }
      65% { left: 10vw; top: 18%; transform: scaleX(-1); }
      70% { left: 10vw; top: 18%; transform: scaleX(1); }
      100% { left: calc(50vw - 45px); top: 6%; transform: scaleX(1); }
    }
    .flying {
      animation: flyAround 3.8s linear forwards;
    }

    /* Scroll Assembly */
    .scroll-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vw;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 200;
      visibility: hidden;
    }
    .scroll-roller {
      width: 102%;
      height: 28px;
      background: #733c11;
      border: 4px solid #3d1e06;
      border-radius: 14px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
      position: relative;
      z-index: 3;
    }
    .scroll-body {
      width: 94%;
      height: 0;
      background: #fce8b1;
      border-left: 5px dashed #d4b572;
      border-right: 5px dashed #d4b572;
      overflow: hidden;
      transition: height 1.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 0 16px;
    }
    .scroll-container.open .scroll-body {
      height: 52vh;
      max-height: 320px;
      padding: 20px 16px;
    }

    /* Typography */
    .scroll-title {
      font-size: 11px;
      color: #5c2c06;
      line-height: 1.8;
      text-align: center;
      margin-bottom: 20px;
    }

    .inline-icon {
      width: 18px;
      height: 18px;
      vertical-align: middle;
      display: inline-block;
      margin: 0 2px;
    }

    /* Options & Checkboxes */
    .options-row {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
      width: 100%;
    }
    .checkbox-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 12px;
      color: #000;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .pixel-box {
      width: 24px;
      height: 24px;
      border: 3px solid #000;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    /* Dynamic Roaming NO Button */
    #no-wrapper {
      position: absolute;
      transition: all 0.22s ease;
      z-index: 500;
      white-space: nowrap;
    }

    /* Absolute Pixel-Aligned Scene Container */
    .scene-container {
      position: relative;
      width: 180px;
      height: 85px;
      margin-top: 10px;
    }
    
    .hero-guy {
      position: absolute;
      left: -100px;
      bottom: 0;
      width: 88px;
      height: 85px;
      transition: left 2.5s cubic-bezier(0.25, 1, 0.5, 1);
      display: block;
    }
    .hero-guy.walked {
      left: 0px;
    }
    .hero-girl {
      position: absolute;
      right: 0px;
      bottom: 0;
      width: 75px;
      height: 85px;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Start Overlay -->
  <div id="start-screen">
    <button class="retro-btn" id="start-btn">▶ PRESS START</button>
  </div>

  <div id="world">
    <!-- SVG Original Pixel Pigeon -->
    <svg id="pigeon" viewBox="0 0 16 16" shape-rendering="crispEdges">
      <path fill="#737373" d="M3 6h5v2H3zM1 8h9v2H1zM3 10h7v2H3z" />
      <path fill="#a3a3a3" d="M8 3h4v3H8z" />
      <path fill="#f59e0b" d="M12 4h3v2h-3z" />
      <path fill="#000" d="M10 4h1v1h-1z" />
      <path fill="#ffffff" d="M10 7h5v4h-5z" />
      <path fill="#ef4444" d="M12 8h2v2h-2z" />
    </svg>

    <!-- First Scroll: Question -->
    <div class="scroll-container" id="scroll-1">
      <div class="scroll-roller"></div>
      <div class="scroll-body">
        <div class="scroll-title" id="question-text">
          Hi Sanskriti, will you go out for dinner with me? 
          <svg class="inline-icon" viewBox="0 0 16 16" shape-rendering="crispEdges">
            <path fill="#d97706" d="M1 2h14v3H1z"/>
            <path fill="#f59e0b" d="M2 5h12v2H2zM3 7h10v2H3zM4 9h8v2H4zM6 11h4v2H6z"/>
            <path fill="#ef4444" d="M4 6h2v2H4zM9 8h2v2H9z"/>
          </svg>
          <svg class="inline-icon" viewBox="0 0 16 16" shape-rendering="crispEdges">
            <path fill="#f59e0b" d="M2 3h4v5H2zM10 3h4v5h-4z"/>
            <path fill="#000" d="M4 8h1v5H4zM11 8h1v5h-1z"/>
            <path fill="#000" d="M2 13h5v1H2zM9 13h5v1H9z"/>
          </svg>
        </div>
        <div class="options-row">
          <div class="checkbox-btn" id="yes-btn">
            <div class="pixel-box" id="yes-box"></div>
            <span>YES</span>
          </div>
        </div>
      </div>
      <div class="scroll-roller"></div>
    </div>

    <!-- Roaming NO Button -->
    <div id="no-wrapper" style="display:none;">
      <div class="checkbox-btn" id="no-btn">
        <div class="pixel-box"></div>
        <span id="no-text">NO</span>
      </div>
    </div>

    <!-- Second Scroll: Celebration -->
    <div class="scroll-container" id="scroll-2">
      <div class="scroll-roller"></div>
      <div class="scroll-body">
        <div class="scroll-title" style="margin-bottom: 5px;">
          OMGGGG YOU SAID YES?! 
          <svg class="inline-icon" viewBox="0 0 16 16" shape-rendering="crispEdges">
            <path fill="#f59e0b" d="M2 2h12v12H2z"/>
            <path fill="#000" d="M4 4h3v4H4zM9 4h3v4H9zM5 10h6v2H5z"/>
            <path fill="#fff" d="M5 4h1v2H5zM10 4h1v2h-1z"/>
          </svg>
          <br><br>
          <span style="font-size: 10px; line-height: 1.6;">
            I CAN'T WAIT! SEE YOU SOON! 
            <svg class="inline-icon" viewBox="0 0 16 16" shape-rendering="crispEdges">
              <path fill="#d97706" d="M1 2h14v3H1z"/>
              <path fill="#f59e0b" d="M2 5h12v2H2zM3 7h10v2H3zM4 9h8v2H4zM6 11h4v2H6z"/>
              <path fill="#ef4444" d="M4 6h2v2H4zM9 8h2v2H9z"/>
            </svg>
            <svg class="inline-icon" viewBox="0 0 16 16" shape-rendering="crispEdges">
              <path fill="#f59e0b" d="M2 3h4v5H2zM10 3h4v5h-4z"/>
              <path fill="#000" d="M4 8h1v5H4zM11 8h1v5h-1z"/>
              <path fill="#000" d="M2 13h5v1H2zM9 13h5v1H9z"/>
            </svg>
          </span>
        </div>
        
        <!-- Character Scene -->
        <div class="scene-container">
          <svg class="hero-guy" id="guy" viewBox="0 0 26 25" shape-rendering="crispEdges">
            <path fill="#6d4c41" d="M5 2h10v4H5zM4 4h12v2H4z"/>
            <path fill="#ffcc80" d="M5 6h10v6H5z"/>
            <path fill="#3e2723" d="M12 7h2v2h-2zM6 7h2v2H6z"/>
            <path fill="#d84315" d="M7 10h1v1H7zM8 11h4v1H8zM12 10h1v1h-1z"/>
            <path fill="#43a047" d="M4 12h12v7H4z"/>
            <path fill="#2e7d32" d="M4 12h2v7H4zM14 12h2v7h-2z"/>
            <path fill="#fff" d="M2 13h2v5H2zM16 13h2v3h-2z"/>
            <path fill="#fbc02d" d="M9 16h2v2H9z"/>
            <path fill="#212121" d="M4 16h12v1H4z"/>
            
            <!-- Rose -->
            <path fill="#b71c1c" d="M19 8h5v5h-5z"/>
            <path fill="#ef5350" d="M20 7h3v1h-3zM19 9h5v2h-5zM21 11h1v1h-1z"/>
            <path fill="#ff8a80" d="M21 9h2v1h-2z"/>
            <path fill="#2e7d32" d="M17 14h2v5h-2z"/>
            <path fill="#43a047" d="M16 16h2v1h-2zM19 15h2v1h-2z"/>
            
            <!-- Green Shoes -->
            <path fill="#2e7d32" d="M5 23h4v2H5zM11 23h4v2h-4z"/>
          </svg>

          <svg class="hero-girl" viewBox="0 0 22 25" shape-rendering="crispEdges">
            <path fill="#ffee58" d="M3 2h16v12H3z"/>
            <path fill="#fbc02d" d="M2 4h18v10H2z"/>
            <path fill="#ffcc80" d="M5 6h12v6H5z"/>
            <path fill="#3e2723" d="M7 8h3v1H7zM12 8h3v1h-3z"/>
            <path fill="#d84315" d="M8 10h1v1H8zM9 11h4v1H9zM13 10h1v1h-1z"/>
            <path fill="#1e88e5" d="M3 12h16v9H3z"/>
            <path fill="#1565c0" d="M2 13h4v4H2zM16 13h4v4h-4z"/>
            <path fill="#bbdefb" d="M7 12h8v2H7zM3 20h16v1H3z"/>
            <path fill="#ffcc80" d="M9 15h4v3H9z"/>
            <path fill="#ffcc80" d="M6 21h3v2H6zM13 21h3v2h-3z"/>
            <path fill="#4e342e" d="M5 23h5v2H5zM12 23h5v2h-5z"/>
          </svg>
        </div>
      </div>
      <div class="scroll-roller"></div>
    </div>

    <div class="ground"></div>
  </div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const startScreen = document.getElementById('start-screen');
    const pigeon = document.getElementById('pigeon');
    const scroll1 = document.getElementById('scroll-1');
    const scroll2 = document.getElementById('scroll-2');
    const yesBtn = document.getElementById('yes-btn');
    const yesBox = document.getElementById('yes-box');
    const noWrapper = document.getElementById('no-wrapper');
    const noText = document.getElementById('no-text');
    const guy = document.getElementById('guy');
    const questionText = document.getElementById('question-text');

    const noPrompts = [
      "Really sure?",
      "Think again!",
      "Last chance!",
      "You might regret this!",
      "Give it another thought!",
      "You know you want this!"
    ];
    let promptIndex = 0;

    startBtn.addEventListener('click', () => {
      startScreen.style.display = 'none';
      pigeon.style.display = 'block';
      pigeon.classList.add('flying');

      setTimeout(() => {
        scroll1.style.visibility = 'visible';
        scroll1.classList.add('open');
        
        const yesRect = yesBtn.getBoundingClientRect();
        noWrapper.style.top = yesRect.top + 'px';
        noWrapper.style.left = (yesRect.right + 25) + 'px';
        noWrapper.style.display = 'block';
      }, 3800);
    });

    function checkOverlap(rect1, rect2, padding = 10) {
      return !(
        rect1.right + padding < rect2.left ||
        rect1.left - padding > rect2.right ||
        rect1.bottom + padding < rect2.top ||
        rect1.top - padding > rect2.bottom
      );
    }

    function dodgeNo() {
      noText.textContent = noPrompts[promptIndex];
      promptIndex = (promptIndex + 1) % noPrompts.length;

      const titleRect = questionText.getBoundingClientRect();
      const yesRect = yesBtn.getBoundingClientRect();
      
      const wrapWidth = noWrapper.offsetWidth || 120;
      const wrapHeight = noWrapper.offsetHeight || 40;

      let randomX, randomY;
      let safe = false;
      let attempts = 0;

      while (!safe && attempts < 150) {
        attempts++;
        randomX = Math.floor(Math.random() * (window.innerWidth - wrapWidth - 20)) + 10;
        randomY = Math.floor(Math.random() * (window.innerHeight - wrapHeight - 60)) + 10;

        const candidateRect = {
          left: randomX,
          top: randomY,
          right: randomX + wrapWidth,
          bottom: randomY + wrapHeight
        };

        const overlapsTitle = checkOverlap(candidateRect, titleRect, 12);
        const overlapsYes = checkOverlap(candidateRect, yesRect, 15);

        if (!overlapsTitle && !overlapsYes) {
          safe = true;
        }
      }

      noWrapper.style.top = randomY + 'px';
      noWrapper.style.left = randomX + 'px';
    }

    noWrapper.addEventListener('mouseover', dodgeNo);
    noWrapper.addEventListener('touchstart', (e) => {
      e.preventDefault();
      dodgeNo();
    });

    yesBtn.addEventListener('click', () => {
      yesBox.textContent = '✓';
      yesBox.style.background = '#16a34a';
      yesBox.style.color = '#fff';
      noWrapper.style.display = 'none';

      setTimeout(() => {
        scroll1.classList.remove('open');
        setTimeout(() => {
          scroll1.style.visibility = 'hidden';
          
          scroll2.style.visibility = 'visible';
          scroll2.classList.add('open');

          setTimeout(() => {
            guy.classList.add('walked');
          }, 400);
        }, 1200);
      }, 400);
    });
  </script>
</body>
</html>
